name: Deploy

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production-preflight' || 'develop' }}
    env:
      DB_URL: ${{ secrets.DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Pending migrations (dry run)
        run: |
          yarn -s supabase db push --db-url "$DB_URL" --dry-run 2>&1 | tee plan.txt
          {
            echo "### Pending migrations → ${{ github.ref_name }}"
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backup:
    if: github.ref_name == 'main'
    needs: plan
    uses: ./.github/workflows/backup.yml
    secrets: inherit

  release:
    needs: [plan, backup]
    # backup is skipped on develop; still require plan success and no failed backup.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.backup.result == 'success' || needs.backup.result == 'skipped') }}
    runs-on: ubuntu-latest
    # production has a required reviewer: this job waits for the Approve click.
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    env:
      DB_URL: ${{ secrets.DB_URL }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Apply migrations
        run: yarn -s supabase db push --db-url "$DB_URL" --yes
      - name: Trigger Vercel deploy
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null

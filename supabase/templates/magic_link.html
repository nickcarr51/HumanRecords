<h2>Sign in to Human Services</h2>
<p>Enter this code to finish signing in:</p>
<p style="font-size: 24px; font-weight: bold; letter-spacing: 3px;">
  {{ .Token }}
</p>
<p>Or sign in directly:</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink">
    Sign in
  </a>
</p>
<p>This code expires in an hour. If you didn't request it, ignore this email.</p>
